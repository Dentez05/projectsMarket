services:
  postgres:
    image: postgres:15-alpine
    container_name: projectsmarket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-api:
    build:
      context: ./backend/Auth.API
      dockerfile: Dockerfile
    container_name: projectsmarket-auth-api
    ports:
      - "127.0.0.1:5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY не задан в .env}"
      Jwt__Issuer: "projectsmarket-api"
      Jwt__Audience: "projectsmarket-client"
      Admin__Email: "${ADMIN_EMAIL:-}"
      Admin__Password: "${ADMIN_PASSWORD:-}"
      Cors__Origins: "${CORS_ORIGINS:-http://localhost:5010,http://localhost:5173}"
      App__FrontendUrl: "${PUBLIC_URL:-http://localhost:5010}"
      Email__Provider: "${EMAIL_PROVIDER:-log}"
      Email__From: "${EMAIL_FROM:-ProjectMarket <noreply@projectsmarket.local>}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  store-api:
    build:
      context: ./backend/Store.API
      dockerfile: Dockerfile
    container_name: projectsmarket-store-api
    ports:
      - "127.0.0.1:5009:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=store_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY не задан в .env}"
      Jwt__Issuer: "projectsmarket-api"
      Jwt__Audience: "projectsmarket-client"
      YooKassa__ShopId: "${YOOKASSA_SHOP_ID:-}"
      YooKassa__SecretKey: "${YOOKASSA_SECRET_KEY:-}"
      YooKassa__ReturnUrl: "${PUBLIC_URL:-http://localhost:5010}/payment-success"
      YooKassa__WebhookUser: "${YOOKASSA_WEBHOOK_USER:-}"
      YooKassa__WebhookPassword: "${YOOKASSA_WEBHOOK_PASSWORD:-}"
      Cors__Origins: "${CORS_ORIGINS:-http://localhost:5010,http://localhost:5173}"
      Email__Provider: "${EMAIL_PROVIDER:-log}"
      Email__From: "${EMAIL_FROM:-ProjectMarket <noreply@projectsmarket.local>}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      App__BaseUrl: "${PUBLIC_URL:-http://localhost:5010}"
    volumes:
      - store_uploads:/app/wwwroot/uploads
      - store_private:/app/uploads-private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: projectsmarket-api-gateway
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Production}
    depends_on:
      auth-api:
        condition: service_healthy
      store-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectsmarket-frontend
    ports:
      - "${FRONTEND_PORT:-5010}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  store_uploads:
  store_private:
