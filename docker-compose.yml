version: '3.8'
    
services:
  postgres:
    image: postgres:15-alpine
    container_name: projectsmarket-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-api:
    build:
      context: ./backend/Auth.API
      dockerfile: Dockerfile
    container_name: projectsmarket-auth-api
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres123"
      Jwt__Key: "projectsmarket-super-secret-key-2024-32chars"
      Jwt__Issuer: "projectsmarket-api"
      Jwt__Audience: "projectsmarket-client"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: