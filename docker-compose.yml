version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: projectsmarket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-api:
    build:
      context: ./backend/Auth.API
      dockerfile: Dockerfile
    container_name: projectsmarket-auth-api
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=auth_db;Username=postgres;Password=postgres123"
      Jwt__Key: "projectsmarket-super-secret-key-2024-32chars"
      Jwt__Issuer: "projectsmarket-api"
      Jwt__Audience: "projectsmarket-client"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  store-api:
    build:
      context: ./backend/Store.API
      dockerfile: Dockerfile
    container_name: projectsmarket-store-api
    ports:
      - "5009:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=store_db;Username=postgres;Password=postgres123"
      Jwt__Key: "projectsmarket-super-secret-key-2024-32chars"
      Jwt__Issuer: "projectsmarket-api"
      Jwt__Audience: "projectsmarket-client"
      YooKassa__ShopId: "1348149"
      YooKassa__SecretKey: "test_SK3HJZ68nhbSlCyjGohseo4EoRcQ749tfKZyWNbQJqY"
      YooKassa__ReturnUrl: "http://localhost:5010/payment/success"
    volumes:
      - store_uploads:/app/wwwroot/uploads
      - store_private:/app/uploads-private
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: projectsmarket-api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - auth-api
      - store-api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectsmarket-frontend
    ports:
      - "5010:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  store_uploads:
  store_private: